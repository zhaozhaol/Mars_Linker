spring:
  application:
    name: mars-linker-broker

server:
  port: 11884

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

# 自研 Broker（阶段 2 起实现 Netty）；默认关闭以免占用端口
mars:
  linker:
    broker:
      netty-enabled: true
      tcp-port: 11883
      boss-threads: 1
      worker-threads: 0
      max-packet-bytes: 262144
      so-backlog: 1024
      # --- 鉴权配置 ---
      auth-enabled: true          # 开启鉴权（默认关闭）
      auth-username: zytxmq  # 账号
      auth-password: mq1890Q*86Y&n  # 密码
      auth-mode: static           # static(本地) 或 http(远程鉴权)
      # --- 存储模式配置 ---
      storage-enabled: true              # 持久化总开关：false 时仅内存运行
      storage-mode: file                 # file(默认) / redis / db（仅 storage-enabled=true 生效）
      storage-migrate-on-startup: false  # 启动时从 file 迁移到目标存储（仅 mode!=file 且 storage-enabled=true）
      # storage-redis-address: localhost:6379  # Redis 地址（mode=redis 时必填）
      # storage-redis-password:               # Redis 密码（可选）
      # storage-redis-database: 0             # Redis 数据库编号
      # storage-redis-timeout-ms: 3000        # Redis 超时（毫秒）
      # storage-redis-key-prefix: ml          # Redis key 前缀
      # storage-db-jdbc-url: jdbc:postgresql://localhost:5432/mars_linker  # JDBC URL（mode=db 时必填）
      # storage-db-username: postgres         # DB 用户名
      # storage-db-password:                  # DB 密码
      # storage-db-schema: public             # DB schema
      # storage-db-table-prefix: ml_          # DB 表名前缀
      session-offline-max-messages: 5000      # 每个 client 离线消息上限（<=0 不限）
      session-offline-ttl-ms: 604800000       # 离线消息保留时长（毫秒，7天，<=0 不过期）
      retain-max-messages: 200000             # retain 总量上限（<=0 不限）
      retain-ttl-ms: 2592000000               # retain 保留时长（毫秒，30天，<=0 不过期）
      acl-enabled: false
      acl-default-deny: false
      acl-allow-subscribe-prefixes: []
      acl-allow-publish-prefixes: []
      acl-deny-subscribe-prefixes: []
      acl-deny-publish-prefixes: []
      # --- 事件通知配置（新配置体系） ---
      event-notify-enabled: true    # 事件通知总开关
      # event-notify-default-forward-rules:          # 全局默认转发规则（未配置独立规则的事件类型继承此规则）
      #   - match-type: regex_match
      #     expression: "device|gateway"
      event-notify-config:                           # 按事件类型配置转发行为
        connected:                                   # 事件类型：连接成功
          enabled: true
          topic: devices/connected
          forward-rules:                             # 仅匹配clientId含device的设备
            - match-type: regex_match
              expression: "device_"
        disconnected:                                # 事件类型：连接断开
          enabled: true
          topic: devices/disconnected
          forward-rules:                             # 仅匹配clientId含device的设备
            - match-type: regex_match
              expression: "device_"
        # connect-refused:                           # 事件类型：连接被拒绝
        #   enabled: true
        # subscribed:                                # 事件类型：订阅成功
        #   enabled: true
        # unsubscribed:                              # 事件类型：取消订阅
        #   enabled: false
        # session-created:                           # 事件类型：会话创建
        #   enabled: true
        # session-destroyed:                         # 事件类型：会话销毁
        #   enabled: true
        # will-published:                            # 事件类型：遗嘱消息发布
        #   enabled: true
        # connection-kicked:                         # 事件类型：旧连接被踢下线
        #   enabled: true
      # --- 旧配置（已废弃，兼容迁移） ---
      # lifecycle-notify-enabled: false
      # lifecycle-connected-topic: devices/connected
      # lifecycle-offline-topic: devices/offline
      # lifecycle-forward-rules: []
    ui:
      enabled: true
      collection-buffer-size: 1000
      monitor-refresh-ms: 5000
      connection-enabled: true
      message-enabled: true
      subscription-enabled: true
      system-enabled: true
      alert-evaluation-enabled: true
      connection-sample-rate: 1.0
      message-sample-rate: 1.0
      subscription-sample-rate: 1.0
      system-sample-rate: 1.0
      aggregation-window-ms: 1000
      max-history-memory-mb: 64
      monitoring-thread-pool-size: 2
      push-thread-pool-size: 2
      max-api-queries-per-second: 30
      max-push-connections: 50
      persist-mode: memory
      admin-username: admin
      admin-password: admin123

logging:
  level:
    root: INFO
    com.mars.linker.broker: INFO
