spring:
  application:
    name: mars-linker-broker

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

# 自研 Broker（阶段 2 起实现 Netty）；默认关闭以免占用端口
mars:
  linker:
    broker:
      netty-enabled: true
      tcp-port: 11883
      boss-threads: 1
      worker-threads: 0
      max-packet-bytes: 262144
      so-backlog: 1024
      # --- 存储模式配置 ---
      storage-enabled: true              # 持久化总开关：false 时仅内存运行
      storage-mode: file                 # file(默认) / redis / db（仅 storage-enabled=true 生效）
      storage-migrate-on-startup: false  # 启动时从 file 迁移到目标存储（仅 mode!=file 且 storage-enabled=true）
      # storage-redis-address: localhost:6379  # Redis 地址（mode=redis 时必填）
      # storage-redis-password:               # Redis 密码（可选）
      # storage-redis-database: 0             # Redis 数据库编号
      # storage-redis-timeout-ms: 3000        # Redis 超时（毫秒）
      # storage-redis-key-prefix: ml          # Redis key 前缀
      # storage-db-jdbc-url: jdbc:postgresql://localhost:5432/mars_linker  # JDBC URL（mode=db 时必填）
      # storage-db-username: postgres         # DB 用户名
      # storage-db-password:                  # DB 密码
      # storage-db-schema: public             # DB schema
      # storage-db-table-prefix: ml_          # DB 表名前缀
      session-offline-max-messages: 5000      # 每个 client 离线消息上限（<=0 不限）
      session-offline-ttl-ms: 604800000       # 离线消息保留时长（毫秒，7天，<=0 不过期）
      retain-max-messages: 200000             # retain 总量上限（<=0 不限）
      retain-ttl-ms: 2592000000               # retain 保留时长（毫秒，30天，<=0 不过期）
      acl-enabled: false
      acl-default-deny: false
      acl-allow-subscribe-prefixes: []
      acl-allow-publish-prefixes: []
      acl-deny-subscribe-prefixes: []
      acl-deny-publish-prefixes: []

logging:
  level:
    root: INFO
    com.mars.linker.broker: INFO
